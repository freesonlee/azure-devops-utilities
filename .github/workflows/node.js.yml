# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform-task:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Check Terraform publishing task
        run: node --test tasks/PublishTerraformPlan/task.test.cjs
      - name: Build production and development tasks
        run: node scripts/build-terraform-task.cjs

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - name: Build Marketplace extensions
        run: npm run build:extensions
      - name: Install browser for application checks
        run: npx playwright install --with-deps chromium
      - name: Locate Chromium for Karma
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_BIN=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Check Terraform viewer behavior
        run: npm run test:viewer
      - name: Check Terraform run artifact discovery
        run: npm run test:terraform-extension
      - name: Check website unit behavior
        run: npm run test:website
      - name: Check standalone website behavior
        run: npm run ui:check:website
      - name: Package production and private development extensions
        run: |
          npm run pack-history
          npm run pack-pipeline
          npm run pack-terraform
          npm run pack-dev
      - name: Check packaged extension host behavior without external assets
        env:
          EXTENSION_ENV: public
        run: npm run ui:check:extensions
      - name: Check packaged Terraform run extension behavior without external assets
        env:
          EXTENSION_ENV: public
        run: npm run ui:check:terraform-extension
      - name: Upload Marketplace packages for review
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-extensions
          path: |
            artifacts/public/*.vsix
            artifacts/dev/*.vsix
          if-no-files-found: error
      - name: Assemble standalone website
        run: npm run pages:prepare
      - name: Upload a Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages/
          

# Deploy job
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
