name: Viewer package validation and publishing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: viewer-package-publish
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@freesonlee'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate Chromium for Karma
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_BIN=" + require("playwright").chromium.executablePath() + "\n")'
      - run: npm run test:viewer
      - run: npm run pack:viewer
      - run: npm run verify:viewer-package
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-viewer-preview
          path: dist/packages/*.tgz
          if-no-files-found: error
      - name: Publish verified package to GitHub Packages
        run: npm publish ./dist/packages/freesonlee-terraform-plan-viewer-angular-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
