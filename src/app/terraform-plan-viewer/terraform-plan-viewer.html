<!-- File Upload Component - stays mounted so its file watcher keeps the active output binding -->
<div #toolbarContainer [class.compact-upload-bar]="currentPlan">
  <div [class.upload-controls]="currentPlan">
    <app-terraform-plan-file-upload
      #uploadToolbar
      (planLoaded)="onPlanLoaded($event)"
      (cdktfLoaded)="onCdktfLoaded($event)"
      (planFileNameChanged)="onPlanFileNameChanged($event)"
      (cdktfFileNameChanged)="onCdktfFileNameChanged($event)"
      (error)="onUploadError($event)"
    >
    </app-terraform-plan-file-upload>
  </div>

  <!-- Right side - File Indicator -->
  <div class="file-indicator-container" *ngIf="currentPlan">
    <app-file-indicator
      [planFileName]="planFileName"
      [cdktfLoaded]="cdktfLoaded"
    >
    </app-file-indicator>
  </div>
</div>

<!-- Display Component - shows when plan is loaded -->
<tf-plan-viewer
  *ngIf="currentPlan"
  [plan]="currentPlan"
  [cdktfMetadata]="currentCdktfJson"
  [options]="{layout: 'page', viewportTopOffset: toolbarHeight}"
  (cdktfStatusChanged)="onCdktfStatusChanged($event)"
  (viewChanged)="onViewSwitchRequested($event)"
>
</tf-plan-viewer>
